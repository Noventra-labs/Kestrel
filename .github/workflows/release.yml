name: Release Kestrel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore Beam/Beam.csproj

      - name: Build and Publish Standalone Kestrel Executable
        run: >
          dotnet publish Beam/Beam.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o Beam/publish

      - name: Stage Standalone Binary
        run: Copy-Item Beam/publish/Kestrel.exe Kestrel.exe -Force
        shell: pwsh

      - name: Build and Publish Setup Wizard Installer
        run: >
          dotnet publish BeamInstaller/BeamInstaller.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o BeamInstaller/publish

      - name: Stage Setup Wizard Binary
        run: Copy-Item BeamInstaller/publish/Kestrel-Setup.exe Kestrel-Setup.exe -Force
        shell: pwsh

      - name: Generate SHA256 Checksums
        run: |
          Get-FileHash Kestrel.exe -Algorithm SHA256 | Format-List | Out-File -FilePath checksums.txt
          Get-FileHash Kestrel-Setup.exe -Algorithm SHA256 | Format-List | Out-File -FilePath checksums.txt -Append
        shell: pwsh

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Kestrel Release ${{ github.ref_name }}
          files: |
            Kestrel.exe
            Kestrel-Setup.exe
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
